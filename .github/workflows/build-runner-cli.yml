name: Build Runner CLI

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
      - integrate/*
    paths:
      - 'Tooling/runner-cli/**'
      - '.github/workflows/build-runner-cli.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Tooling/runner-cli/**'
      - '.github/workflows/build-runner-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Runner CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tooling/runner-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    name: Publish Runner CLI (${{ matrix.rid }})
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64]
    defaults:
      run:
        working-directory: Tooling/runner-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file
        run: >
          dotnet publish RunnerCli/RunnerCli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          --output ./publish/${{ matrix.rid }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-cli-${{ matrix.rid }}
          path: Tooling/runner-cli/publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 90
