name: Runner Audit

permissions:
  actions: read

env:
  LVIE_EXPECTED_RUNNER_LABEL: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
  LVIE_CANONICAL_RUNNER_LABEL: self-hosted-windows-lv

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

concurrency:
  group: runner-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download runner-cli (optional)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cliDir = Join-Path $env:RUNNER_TEMP 'runner-cli'
          $cliPath = Join-Path $cliDir 'runner-cli.exe'
          if (Test-Path $cliPath) {
            Write-Host "runner-cli already present at $cliPath"
            exit 0
          }
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            Write-Warning 'gh CLI not found; skipping runner-cli download.'
            exit 0
          }
          $repo = if ($env:GITHUB_REPOSITORY) { $env:GITHUB_REPOSITORY } else { '${{ github.repository }}' }
          $branch = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { '${{ github.ref_name }}' }
          Write-Host "Finding latest successful build-runner-cli run for $repo@$branch ..."
          try {
            $runs = gh run list -R $repo -w build-runner-cli.yml -b $branch -s success -L 1 --json databaseId | ConvertFrom-Json
          } catch {
            Write-Warning ("Failed to query workflow runs: {0}" -f $_.Exception.Message)
            exit 0
          }
          $runId = if ($runs -is [array]) { $runs[0].databaseId } else { $runs.databaseId }
          if (-not $runId) {
            Write-Warning 'No successful build-runner-cli run found; skipping download.'
            exit 0
          }
          New-Item -Path $cliDir -ItemType Directory -Force | Out-Null
          try {
            gh run download $runId -R $repo -n runner-cli-win-x64 -D $cliDir | Out-Null
          } catch {
            Write-Warning ("Failed to download runner-cli artifact: {0}" -f $_.Exception.Message)
            exit 0
          }
          if (Test-Path $cliPath) {
            Write-Host "Downloaded runner-cli to $cliPath"
          } else {
            Write-Warning "runner-cli artifact downloaded but runner-cli.exe not found in $cliDir"
          }
      - name: Runner bootstrap (stateless)
        uses: ./.github/actions/runner-bootstrap
        with:
          safe_directory_scope: System
      - name: Validate runner contract
        shell: pwsh
        run: |
          # Try CLI first, fall back to PowerShell
          $cli = Join-Path $env:RUNNER_TEMP 'runner-cli' 'runner-cli.exe'
          if (Test-Path $cli) {
            Write-Host 'Validating contract with runner-cli …'
            & $cli validate-contract --contract-path $env:LVIE_RUNNER_CONTRACT_PATH
          } else {
            Write-Host 'runner-cli not found; using PowerShell fallback.'
            pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\Validate-RunnerContract.ps1"
          }
