name: LabVIEW Parity

on:
  workflow_call:
    inputs:
      lv_release:
        required: false
        type: string
        default: "2026q1"
      run_build_spec:
        required: false
        type: boolean
        default: true
      run_self_hosted:
        required: false
        type: boolean
        default: true
      expected_sha:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      lv_release:
        description: LabVIEW container release tag (for example, 2026q1)
        required: false
        default: "2026q1"
      run_build_spec:
        description: Run ExecuteBuildSpec parity for Editor Packed Library
        required: false
        type: boolean
        default: true
      run_self_hosted:
        description: Run self-hosted parity lane in this workflow
        required: false
        type: boolean
        default: true
      expected_sha:
        description: Optional commit SHA contract; workflow fails if github.sha does not match
        required: false
        type: string
  push:
    branches:
      - develop
  pull_request:
    paths:
      - ".github/workflows/labview-parity.yml"
      - ".github/workflows/labview-container-parity.yml"
      - "Tooling/container-parity/**"
      - "Test/Templates/**"
      - "lv_icon_editor.lvproj"
      - ".lvversion"

permissions:
  contents: read

jobs:
  resolve-parity-context:
    name: Resolve parity context
    runs-on: ubuntu-latest
    outputs:
      lv_release: ${{ steps.resolve.outputs.lv_release }}
      run_build_spec: ${{ steps.resolve.outputs.run_build_spec }}
      run_self_hosted: ${{ steps.resolve.outputs.run_self_hosted }}
    steps:
      - id: resolve
        name: Resolve inputs + SHA contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sha = '${{ github.sha }}'
          $expectedSha = '${{ inputs.expected_sha }}'
          if ([string]::IsNullOrWhiteSpace($expectedSha)) {
            $expectedSha = '${{ github.event.inputs.expected_sha }}'
          }
          if (-not [string]::IsNullOrWhiteSpace($expectedSha) -and $expectedSha -ne $sha) {
            throw ("expected_sha '{0}' does not match github.sha '{1}'." -f $expectedSha, $sha)
          }

          $lvRelease = '${{ inputs.lv_release }}'
          if ([string]::IsNullOrWhiteSpace($lvRelease)) {
            $lvRelease = '${{ github.event.inputs.lv_release }}'
          }
          if ([string]::IsNullOrWhiteSpace($lvRelease)) {
            $lvRelease = '2026q1'
          }

          $runBuildSpecRaw = '${{ inputs.run_build_spec }}'
          if ([string]::IsNullOrWhiteSpace($runBuildSpecRaw)) {
            $runBuildSpecRaw = '${{ github.event.inputs.run_build_spec }}'
          }
          $runBuildSpec = 'true'
          if (-not [string]::IsNullOrWhiteSpace($runBuildSpecRaw) -and $runBuildSpecRaw.Equals('false', [System.StringComparison]::OrdinalIgnoreCase)) {
            $runBuildSpec = 'false'
          }

          $runSelfHostedRaw = '${{ inputs.run_self_hosted }}'
          if ([string]::IsNullOrWhiteSpace($runSelfHostedRaw)) {
            $runSelfHostedRaw = '${{ github.event.inputs.run_self_hosted }}'
          }
          $runSelfHosted = 'true'
          if (-not [string]::IsNullOrWhiteSpace($runSelfHostedRaw) -and $runSelfHostedRaw.Equals('false', [System.StringComparison]::OrdinalIgnoreCase)) {
            $runSelfHosted = 'false'
          }

          "lv_release=$lvRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "run_build_spec=$runBuildSpec" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "run_self_hosted=$runSelfHosted" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  parity-linux:
    name: Parity (Linux Container)
    needs: [resolve-parity-context]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build-spec mode
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN_BUILD_SPEC=${{ needs.resolve-parity-context.outputs.run_build_spec }}" >> "$GITHUB_ENV"

      - name: Pull LabVIEW Linux image
        shell: bash
        run: |
          set -euo pipefail
          LV_RELEASE="${{ needs.resolve-parity-context.outputs.lv_release }}"
          IMAGE="nationalinstruments/labview:${LV_RELEASE}-linux"
          echo "Using image: ${IMAGE}"
          docker pull "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "LV_RELEASE=${LV_RELEASE}" >> "$GITHUB_ENV"

      - name: Run LabVIEWCLI parity script (Linux)
        shell: bash
        run: |
          set -euo pipefail
          LV_YEAR="${LV_RELEASE:0:4}"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e LVIE_REPO_ROOT=/workspace \
            -e WORKSPACE_ROOT=/workspace \
            -e REPO_ROOT=/workspace \
            -e "LVIE_PROJECT_RELATIVE_PATH=lv_icon_editor.lvproj" \
            -e "PROJECT_PATH_REL=lv_icon_editor.lvproj" \
            -e "LVIE_PROJECT_PATH=/workspace/lv_icon_editor.lvproj" \
            -e "PROJECT_PATH=/workspace/lv_icon_editor.lvproj" \
            -e "TARGET_DIR_REL=Test/Templates" \
            -e "LV_YEAR=${LV_YEAR}" \
            -e "CONTAINER_PARITY_EXCLUDE_FILES=Polymorphic Template.vi" \
            -e "CONTAINER_PARITY_BUILD_SPEC=${RUN_BUILD_SPEC}" \
            -e "CONTAINER_PARITY_BUILD_SPEC_NAME=Editor Packed Library" \
            -e "CONTAINER_PARITY_TARGET_NAME=My Computer" \
            -e "CONTAINER_PARITY_BUILD_OUTPUT_RELATIVE_PATH=resource/plugins/lv_icon.lvlibp" \
            -e "CONTAINER_PARITY_LABVIEW_VERSION=${LV_YEAR}" \
            "$IMAGE" \
            bash -lc "chmod +x /workspace/Tooling/container-parity/runlabview-linux.sh && /workspace/Tooling/container-parity/runlabview-linux.sh"

      - name: Verify built specification output (Linux container)
        if: ${{ env.RUN_BUILD_SPEC == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          output_path="${GITHUB_WORKSPACE}/resource/plugins/lv_icon.lvlibp"
          if [[ ! -f "$output_path" ]]; then
            echo "Expected build output was not found: $output_path" >&2
            exit 1
          fi
          bytes="$(wc -c < "$output_path" | xargs)"
          echo "Built specification artifact: $output_path ($bytes bytes)"

      - name: Upload built specification artifact (Linux container)
        if: ${{ env.RUN_BUILD_SPEC == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: labview-container-editor-packed-library-linux
          path: resource/plugins/lv_icon.lvlibp
          if-no-files-found: error
          retention-days: 14

      - name: Upload LabVIEWCLI logs (Linux container)
        if: ${{ env.RUN_BUILD_SPEC == 'true' || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: labview-container-logs-linux
          path: TestResults/container-parity/linux/logs
          if-no-files-found: warn
          retention-days: 14

  parity-windows:
    name: Parity (Windows Container)
    needs: [resolve-parity-context]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build-spec mode
        shell: pwsh
        run: |
          "RUN_BUILD_SPEC=${{ needs.resolve-parity-context.outputs.run_build_spec }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pull LabVIEW Windows image
        shell: pwsh
        run: |
          $lvRelease = '${{ needs.resolve-parity-context.outputs.lv_release }}'
          $image = "nationalinstruments/labview:$lvRelease-windows"
          Write-Host "Using image: $image"
          docker pull $image
          "IMAGE=$image" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LV_RELEASE=$lvRelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate path contract for Windows container shell
        shell: pwsh
        run: |
          Write-Host 'Windows container parity script runs under powershell.exe (Windows PowerShell 5.1) inside the NI container.'
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\Tooling\Test-PathContract.ps1" -WriteSummary

      - name: Run LabVIEWCLI parity script (Windows)
        shell: pwsh
        run: |
          $lvYear = if ($env:LV_RELEASE -match '^(?<year>\d{4})') { $Matches['year'] } else { '2026' }
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:C:\workspace" `
            -e LVIE_REPO_ROOT=C:\workspace `
            -e WORKSPACE_ROOT=C:\workspace `
            -e REPO_ROOT=C:\workspace `
            -e "LVIE_PROJECT_RELATIVE_PATH=lv_icon_editor.lvproj" `
            -e "PROJECT_PATH_REL=lv_icon_editor.lvproj" `
            -e "LVIE_PROJECT_PATH=C:\workspace\lv_icon_editor.lvproj" `
            -e "PROJECT_PATH=C:\workspace\lv_icon_editor.lvproj" `
            -e "TARGET_DIR_REL=Test\Templates" `
            -e "CONTAINER_PARITY_EXCLUDE_FILES=Polymorphic Template.vi" `
            -e "CONTAINER_PARITY_BUILD_SPEC=${env:RUN_BUILD_SPEC}" `
            -e "CONTAINER_PARITY_BUILD_SPEC_NAME=Editor Packed Library" `
            -e "CONTAINER_PARITY_TARGET_NAME=My Computer" `
            -e "CONTAINER_PARITY_BUILD_OUTPUT_RELATIVE_PATH=resource\plugins\lv_icon.lvlibp" `
            -e "CONTAINER_PARITY_LABVIEW_VERSION=$lvYear" `
            $env:IMAGE `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\workspace\Tooling\container-parity\runlabview-windows.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Windows container parity run failed with exit code $LASTEXITCODE."
          }

      - name: Verify built specification output (Windows container)
        if: ${{ env.RUN_BUILD_SPEC == 'true' }}
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'resource\plugins\lv_icon.lvlibp'
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw "Expected build output was not found: $outputPath"
          }
          $item = Get-Item -LiteralPath $outputPath
          Write-Host ("Built specification artifact: {0} ({1} bytes)" -f $item.FullName, $item.Length)

      - name: Upload built specification artifact (Windows container)
        if: ${{ env.RUN_BUILD_SPEC == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: labview-container-editor-packed-library-windows
          path: resource/plugins/lv_icon.lvlibp
          if-no-files-found: error
          retention-days: 14

      - name: Upload LabVIEWCLI logs (Windows container)
        if: ${{ env.RUN_BUILD_SPEC == 'true' || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: labview-container-logs-windows
          path: TestResults/container-parity/windows/logs
          if-no-files-found: warn
          retention-days: 14

  parity-self-hosted:
    name: Parity (Self-Hosted Runner)
    needs: [resolve-parity-context]
    if: ${{ (github.event_name == 'push' && github.ref_name == 'develop') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && needs.resolve-parity-context.outputs.run_self_hosted == 'true') }}
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          acquire_lock: 'true'
          create_worktree: 'true'
          bitness: 64
          worktree_root_mode: runner_temp

      - name: Assert project LVVersion contract
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          pwsh -NoProfile -File .\Tooling\Assert-LabVIEWVersion.ps1 `
            -RepoRoot "$env:REPO_ROOT" `
            -ProjectPath "$env:PROJECT_PATH" `
            -EnforceProjectLvVersion `
            -Context 'headless-project-contract' `
            -WriteSummary

      - name: Run headless local parity sequence (64-bit)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          pwsh -NoProfile -File .\Tooling\Run-CICompositeLocal-Auto.ps1 `
            -LabVIEWBitness 64 `
            -EnableSingleBitnessRecoverySequence `
            -SuccessTarget ppl-single `
            -MaxAttempts 3 `
            -SkipVerifyIEPaths `
            -SkipMissingInProject `
            -SkipBuildVip `
            -UseWorktree:$false `
            -RepoRoot "$env:REPO_ROOT" `
            -WorktreeRoot "$env:LVIE_WORKTREE_ROOT"

      - name: Resolve artifact root
        if: always()
        shell: pwsh
        run: |
          $repoRoot = if ([string]::IsNullOrWhiteSpace($env:REPO_ROOT)) { $env:GITHUB_WORKSPACE } else { $env:REPO_ROOT }
          "HEADLESS_REPO_ROOT=$repoRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload LabVIEWCLI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labview-parity-self-hosted-labviewcli-logs
          path: ${{ env.HEADLESS_REPO_ROOT }}/builds/logs/labviewcli-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labview-parity-self-hosted-agent-logs
          path: ${{ env.HEADLESS_REPO_ROOT }}/TestResults/agent-logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labview-parity-self-hosted-build-status
          path: ${{ env.HEADLESS_REPO_ROOT }}/builds/status/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload 64-bit PPL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labview-parity-self-hosted-lv_icon_x64
          path: ${{ env.HEADLESS_REPO_ROOT }}/resource/plugins/lv_icon_x64.lvlibp
          if-no-files-found: warn
          retention-days: 14

      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          repo_root: ${{ env.REPO_ROOT }}
          close_labview: 'true'
          close_bitness: 64
          cleanup_worktree: 'true'
          release_lock: 'true'
