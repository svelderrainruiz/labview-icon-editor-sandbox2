name: LabVIEW Container Parity (Compatibility Wrapper)

on:
  workflow_dispatch:
    inputs:
      lv_release:
        description: LabVIEW container release tag (for example, 2026q1)
        required: false
        default: "2026q1"
      run_build_spec:
        description: Run ExecuteBuildSpec parity for Editor Packed Library
        required: false
        type: boolean
        default: true
      run_self_hosted:
        description: Run self-hosted parity lane in the canonical workflow
        required: false
        type: boolean
        default: true
      expected_sha:
        description: Optional commit SHA contract; workflow fails if github.sha does not match
        required: false
        type: string

jobs:
  forward:
    name: Forward to LabVIEW Parity
    uses: ./.github/workflows/labview-parity.yml
    with:
      lv_release: ${{ inputs.lv_release }}
      run_build_spec: ${{ inputs.run_build_spec }}
      run_self_hosted: ${{ inputs.run_self_hosted }}
      expected_sha: ${{ inputs.expected_sha }}
