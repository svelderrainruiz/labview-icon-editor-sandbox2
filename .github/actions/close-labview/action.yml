name: "Close LabVIEW"
description: "Runs Close_LabVIEW.ps1 to gracefully shut down a LabVIEW instance."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: false

    - name: Run Close_LabVIEW.ps1
      shell: pwsh
      run: |
        & "${{ github.action_path }}/Close_LabVIEW.ps1" `
          -MinimumSupportedLVVersion ${{ inputs.minimum_supported_lv_version }} `
          -SupportedBitness ${{ inputs.supported_bitness }}
inputs:
  minimum_supported_lv_version:
    description: 'LabVIEW major version'
    required: true
  supported_bitness:
    description: '32 or 64'
    required: true
  checkout:
    description: 'Whether to checkout the repository before running'
    required: false
    default: 'true'
