name: "Apply VIPC Dependencies"
description: "Runs ApplyVIPC.ps1 to install runner dependencies for a given LabVIEW version/bitness via VIPM CLI."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run ApplyVIPC.ps1
      shell: pwsh
      run: |
        $lvVersion = "${{ inputs.labview_version }}"
        if ([string]::IsNullOrWhiteSpace($lvVersion)) {
          Write-Warning "labview_version not provided; ApplyVIPC will resolve .lvversion from repo root."
        }
        $args = @(
          '-LabVIEWVersion', $lvVersion,
          '-SupportedBitness', '${{ inputs.supported_bitness }}',
          '-RepoRoot', '${{ inputs.repo_root }}',
          '-VIPCPath', '${{ inputs.vipc_path }}',
          '-VipmTimeoutSeconds', '${{ inputs.vipm_timeout_seconds }}',
          '-VipmMaxAttempts', '${{ inputs.vipm_max_attempts }}',
          '-VipmRetryDelaySeconds', '${{ inputs.vipm_retry_delay_seconds }}'
        )
        if ('${{ inputs.allow_vipc_target_mismatch }}' -eq 'true') {
          $args += '-AllowVipcTargetMismatch'
        }
        & "${{ github.action_path }}/ApplyVIPC.ps1" @args
inputs:
  labview_version:
    description: 'LabVIEW version to target (year or numeric).'
    required: false
  supported_bitness:
    description: '32 or 64'
    required: true
  repo_root:
    description: 'Workspace root path'
    required: true
  vipc_path:
    description: 'Path under repo for the .vipc file (relative to workspace)'
    required: true
  allow_vipc_target_mismatch:
    description: 'Allow VIPC target version mismatches (temporary migration override).'
    required: false
    default: 'false'
  vipm_timeout_seconds:
    description: 'VIPM command timeout in seconds.'
    required: false
    default: '600'
  vipm_max_attempts:
    description: 'Maximum VIPM command attempts.'
    required: false
    default: '3'
  vipm_retry_delay_seconds:
    description: 'Retry delay in seconds for VIPM lock contention.'
    required: false
    default: '5'



