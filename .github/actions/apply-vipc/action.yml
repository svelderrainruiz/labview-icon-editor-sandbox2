name: "Apply VIPC Dependencies"
description: "Runs ApplyVIPC.ps1 to install runner dependencies for a given LabVIEW version/bitness."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run ApplyVIPC.ps1
      shell: pwsh
      run: |
        $lvVersion = "${{ inputs.labview_version }}"
        if ([string]::IsNullOrWhiteSpace($lvVersion)) {
          Write-Warning "labview_version not provided; ApplyVIPC will resolve .lvversion from repo root."
        }

        $allowMismatch = ("${{ inputs.allow_vipc_target_mismatch }}" -eq 'true')
        $applyArgs = @(
          '-LabVIEWVersion', $lvVersion,
          '-SupportedBitness', '${{ inputs.supported_bitness }}',
          '-RepoRoot', '${{ inputs.repo_root }}',
          '-VIPCPath', '${{ inputs.vipc_path }}',
          '-VipmTimeoutSeconds', '${{ inputs.vipm_timeout_seconds }}',
          '-VipmMaxAttempts', '${{ inputs.vipm_max_attempts }}',
          '-VipmRetryDelaySeconds', '${{ inputs.vipm_retry_delay_seconds }}'
        )
        if ($allowMismatch) {
          $applyArgs += '-AllowVipcTargetMismatch'
        }

        & "${{ github.action_path }}/ApplyVIPC.ps1" @applyArgs
inputs:
  labview_version:
    description: 'LabVIEW version to target (year or numeric).'
    required: false
  supported_bitness:
    description: '32 or 64'
    required: true
  repo_root:
    description: 'Workspace root path'
    required: true
  vipc_path:
    description: 'Path under repo for the .vipc file (relative to workspace)'
    required: true
  allow_vipc_target_mismatch:
    description: 'Temporarily allow VIPC target mismatch against .lvversion.'
    required: false
    default: 'false'
  vipm_timeout_seconds:
    description: 'Timeout for vipm command execution.'
    required: false
    default: '1800'
  vipm_max_attempts:
    description: 'Maximum attempts for lock-contention retries.'
    required: false
    default: '3'
  vipm_retry_delay_seconds:
    description: 'Delay between lock-contention retries.'
    required: false
    default: '5'



